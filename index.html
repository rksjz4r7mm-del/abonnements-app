<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes abonnements</title>
<meta name="theme-color" content="#2B3BE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abonnements">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{--bg:#F3F4FB;--panel:#fff;--ink:#10132A;--mute:#5B6082;--line:#E2E5F3;--brand:#2B3BE8;--danger:#C4243C;--field:#fff;--sh:rgba(16,19,42,.45)}
@media (prefers-color-scheme:dark){:root{--bg:#0D1024;--panel:#171B37;--ink:#EEF0FF;--mute:#A0A6CF;--line:#2A2F58;--brand:#5563FF;--danger:#FF7389;--field:#0D1024;--sh:rgba(0,0,0,.65)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mute);min-height:34px}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.hero{background:var(--brand);color:#fff;border-radius:24px;padding:26px 22px}
.hero p{margin:0}
.big{font-size:clamp(46px,15vw,66px);font-weight:800;letter-spacing:-.035em;line-height:1.02;font-variant-numeric:tabular-nums;margin:8px 0 6px}
.hero .y{font-weight:600}
.hero .c{opacity:.8;font-size:15px;margin-top:2px}
.warn{margin-top:12px;background:var(--panel);border:1.5px solid var(--danger);color:var(--danger);border-radius:14px;padding:12px 14px;font-weight:600}
.empty{text-align:center;padding:40px 12px 8px}
.empty svg{width:96px;height:96px;color:var(--brand)}
.empty h2{margin:14px 0 6px;font-size:21px;letter-spacing:-.01em}
.empty p{margin:0 auto 20px;color:var(--mute);max-width:34ch}
h2.sec{font-size:15px;font-weight:700;margin:26px 4px 10px;color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;list-style:none;margin:0;padding:0}
.panel li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 14px;width:100%;text-align:left;background:none;border:0;padding:14px 16px;min-height:64px}
.row .nm{font-weight:700;overflow-wrap:anywhere}
.row .pr{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.row .mt,.row .un{color:var(--mute);font-size:14px}
.row .un{text-align:right}
.hint,.priv{color:var(--mute);font-size:14px;margin:10px 4px 0}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:12px 4px;min-height:44px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;min-height:50px;background:var(--brand);color:#fff}
.btn.sec2{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.dng{background:none;color:var(--danger);border:1.5px solid var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:0 26px;min-height:54px;font-weight:700;box-shadow:0 8px 24px var(--sh);display:flex;align-items:center;gap:8px}
.fab b{font-size:24px;line-height:1;font-weight:500}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;background:var(--sh)}
.sheet[hidden]{display:none}
.card{background:var(--bg);width:100%;max-width:560px;max-height:94dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card h2{margin:0 0 14px;font-size:20px;letter-spacing:-.01em}
label{display:block;font-weight:600;font-size:14px;color:var(--mute);margin-bottom:12px}
input,select{display:block;width:100%;margin-top:5px;background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--ink);min-height:48px;-webkit-appearance:none;appearance:none}
input[aria-invalid=true]{border-color:var(--danger)}
.err{display:block;color:var(--danger);font-weight:600;margin-top:4px}
.err[hidden]{display:none}
.stack{display:grid;gap:10px;margin-top:6px}
#bmsg{margin:12px 0 0;font-weight:600;min-height:1.4em}
#bmsg.bad{color:var(--danger)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 data-i18n="title"></h1>
    <div class="seg" role="group" aria-label="Langue / Language">
      <button type="button" data-lang="fr" aria-pressed="false">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <section class="hero" aria-live="polite">
    <p data-i18n="perMonth"></p>
    <div class="big" id="month"></div>
    <p class="y" id="year"></p>
    <p class="c" id="count"></p>
  </section>
  <div class="warn" id="warn" role="alert" hidden></div>
  <section class="empty" id="empty" hidden>
    <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="48" cy="48" r="34"/><path d="M33 49l11 11 20-23"/></svg>
    <h2 data-i18n="emptyTitle"></h2>
    <p data-i18n="emptyText"></p>
    <button type="button" class="btn" id="addFirst" data-i18n="addFirst"></button>
  </section>
  <section id="listWrap" hidden>
    <h2 class="sec" data-i18n="upcoming"></h2>
    <ul class="panel" id="list"></ul>
    <p class="hint" data-i18n="hint"></p>
  </section>
  <button type="button" class="link" id="openBackup" data-i18n="backup"></button>
  <p class="priv" data-i18n="privacy"></p>
</div>
<button type="button" class="fab" id="fab"><b aria-hidden="true">+</b><span data-i18n="add"></span></button>

<div class="sheet" id="sheetForm" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <h2 id="formTitle"></h2>
    <form id="form" novalidate>
      <label><span data-i18n="name"></span><input id="f-name" maxlength="80" autocomplete="off" data-ph="namePh" aria-describedby="e-name"><span class="err" id="e-name" data-i18n="errName" hidden></span></label>
      <label><span data-i18n="price"></span><input id="f-price" inputmode="decimal" autocomplete="off" placeholder="9,99" aria-describedby="e-price"><span class="err" id="e-price" data-i18n="errPrice" hidden></span></label>
      <label><span data-i18n="freq"></span><select id="f-freq"></select></label>
      <label><span data-i18n="next"></span><input id="f-next" type="date" aria-describedby="e-next"><span class="err" id="e-next" data-i18n="errDate" hidden></span></label>
      <div class="stack">
        <button type="submit" class="btn" data-i18n="save"></button>
        <button type="button" class="btn sec2" data-close data-i18n="cancel"></button>
        <button type="button" class="btn dng" id="f-del" data-i18n="del" hidden></button>
      </div>
    </form>
  </div>
</div>

<div class="sheet" id="sheetBackup" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="bTitle">
    <h2 id="bTitle" data-i18n="backupTitle"></h2>
    <p class="hint" style="margin:0 0 14px" data-i18n="backupHelp"></p>
    <div class="stack">
      <button type="button" class="btn" id="doExport" data-i18n="export"></button>
      <button type="button" class="btn sec2" id="doImport" data-i18n="import"></button>
      <button type="button" class="btn sec2" data-close data-i18n="close"></button>
    </div>
    <p id="bmsg" role="status"></p>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
